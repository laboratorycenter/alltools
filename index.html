<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>3D Model Viewer</title>

    <script type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
    </script>

    <style>

        /* Remove default spacing */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;

            /* Make the page exactly the height of the screen */
            height: 100vh;

            /* Prevent the page itself from scrolling */
            overflow: hidden;
        }


        /* =================================
           TOP BUTTON BAR
           ================================= */

        .buttons {
            height: 70px;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 10px;

            padding: 10px;

            background: white;

            /* Make sure buttons are above everything */
            position: relative;
            z-index: 10;

            overflow-x: auto;
        }


        /* Individual buttons */

        .model-button {
            padding: 10px 20px;

            border: none;
            border-radius: 6px;

            background: #ddd;

            cursor: pointer;

            font-size: 16px;

            white-space: nowrap;
        }


        .model-button:hover {
            background: #bbb;
        }


        /* Currently selected model */

        .model-button.active {
            background: #333;
            color: white;
        }


        /* =================================
           3D VIEWER
           ================================= */

        model-viewer {

            /* Take up remaining screen */
            width: 100%;

            height: calc(100vh - 70px);

            display: block;

            background: #eaeaea;
        }

    </style>
</head>


<body>


    <!-- =================================
         BUTTONS
         ================================= -->

    <div class="buttons">

        <button
            class="model-button active"
            onclick="changeModel('laser-cutting.glb', this)">
            Laser Cutting
        </button>


        <button
            class="model-button"
            onclick="changeModel('CNC.glb', this)">
            CNC Machine
        </button>


        <!--
        =====================================
        COPY THIS BLOCK TO ADD MORE MODELS
        =====================================

        <button
            class="model-button"
            onclick="changeModel('your-model.glb', this)">
            Your Model
        </button>

        -->

    </div>


    <!-- =================================
         3D MODEL
         ================================= -->

    <model-viewer
        id="viewer"
        src="laser-cutting.glb"

        camera-controls
        auto-rotate

        shadow-intensity="1"
        exposure="1">
    </model-viewer>


    <!-- =================================
         JAVASCRIPT
         ================================= -->

    <script>

        function changeModel(filename, button) {

            // Change model
            const viewer = document.getElementById("viewer");

            viewer.src = filename;


            // Remove active state
            document
                .querySelectorAll(".model-button")
                .forEach(btn => {
                    btn.classList.remove("active");
                });


            // Highlight clicked button
            button.classList.add("active");

        }

    </script>


</body>
</html>
