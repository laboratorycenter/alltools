<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My 3D Model</title>

    <script type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
    </script>

    <style>
        body {
            margin: 0;
            background: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        model-viewer {
            width: 100%;
            height: 100vh;
        }
    </style>
</head>

<body>

    <model-viewer
        src="laser-cutting.glb"
        camera-controls
        auto-rotate
        shadow-intensity="1"
        exposure="1">
    </model-viewer>

</body>
</html>
